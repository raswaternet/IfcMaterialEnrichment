[project]
name = "ifc-splitter"
version = "0.1.0"
description = "Split IFC into Linked Data (RDF/Turtle) and geometry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdflib>=7.0.0",
    "ifcopenshell>=0.7.0",
]

[project.scripts]
ifc-splitter = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["extractors*", "rdf*", "utils*"]
